name: Test e pubblicazione

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Verifiche
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: node scripts/sicurezza.cjs
      - run: node tests/verify.cjs

  deploy:
    name: Pubblicazione
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url || steps.pages2.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepara l'artefatto pubblico
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude '.git/' --exclude '.github/' --exclude 'tests/' --exclude 'scripts/' --exclude 'desktop/' \
            --exclude 'package.json' --exclude '__pycache__/' --exclude '*.pyc' ./ "$RUNNER_TEMP/site/"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
      - id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true
      - name: Attendi che l'artefatto sia visibile
        if: steps.pages.outcome == 'failure'
        run: sleep 25
      - name: Riprova la pubblicazione
        if: steps.pages.outcome == 'failure'
        id: pages2
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  sito:
    name: Il sito serve la versione giusta
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verifica il service worker pubblicato
        env:
          BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          set -euo pipefail
          versione="td-v$(node -p "require('./package.json').version")"
          for tentativo in $(seq 1 20); do
            if curl -fsSL --max-time 30 "${BASE}sw.js" | grep -qF "VERSION = \"$versione\""; then
              echo "✓ il sito serve $versione"; exit 0
            fi
            echo "… non ancora aggiornato (tentativo $tentativo)"; sleep 15
          done
          echo "::error::Il sito non serve lo sw.js di $versione."; exit 1
